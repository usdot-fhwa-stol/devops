name: Scheduled GitHub Repo Settings Scan

on:
  schedule:
    # Run on 1st and 15th of every month at 08:00
    - cron: "0 8 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install -r audit-github-repo-settings_requirements.txt

      - name: Scan develop branches
        env:
          AUDIT_TOKEN: ${{ secrets.DEVOPS_GITHUB_TOKEN }}
          ISSUE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ./audit-github-repo-settings.py \
            --branches develop \
            --github-token "$AUDIT_TOKEN" \
            --issue-token "$ISSUE_TOKEN" \
            --open-github-issues \
            --organizations usdot-fhwa-stol usdot-fhwa-ops usdot-jpo-ode

      - name: Scan master branches
        env:
          AUDIT_TOKEN: ${{ secrets.DEVOPS_GITHUB_TOKEN }}
          ISSUE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ./audit-github-repo-settings.py \
            --branches master \
            --github-token "$AUDIT_TOKEN" \
            --issue-token "$ISSUE_TOKEN" \
            --open-github-issues \
            --organizations usdot-fhwa-stol usdot-fhwa-ops usdot-jpo-ode

      - name: Scan main branches
        env:
          AUDIT_TOKEN: ${{ secrets.DEVOPS_GITHUB_TOKEN }}
          ISSUE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ./audit-github-repo-settings.py \
            --branches main \
            --github-token "$AUDIT_TOKEN" \
            --issue-token "$ISSUE_TOKEN" \
            --open-github-issues \
            --organizations usdot-fhwa-stol usdot-fhwa-ops usdot-jpo-ode
