name: Generate Release Notes
on:
  workflow_dispatch:
    inputs:
      organization:
        description: 'Organization to scan'
        required: true
        default: 'usdot-fhwa-stol'
        type: choice
        options:
          - usdot-fhwa-OPS
          - usdot-fhwa-stol
          - usdot-jpo-ode
      release_branch:
        description: 'Release branch to compare from'
        required: true
        type: string
      stable_branch:
        description: 'Stable branch to compare to'
        required: true
        default: 'master'
        type: string
      version:
        description: 'Version number to use in release notes'
        required: true
        type: string
permissions:
  contents: read

jobs:
  generate-release-notes:
    runs-on: ubuntu-latest
    env:
      INPUT_ORGANIZATION: ${{ inputs.organization }}
      INPUT_RELEASE_BRANCH: ${{ inputs.release_branch }}
      INPUT_STABLE_BRANCH: ${{ inputs.stable_branch }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
    - name: Validate inputs
      shell: bash
      run: |
        set -euo pipefail
        case "$INPUT_ORGANIZATION" in
          usdot-fhwa-stol|usdot-fhwa-OPS|usdot-jpo-ode) ;;
          *) echo "Invalid organization" >&2; exit 1 ;;
        esac
        git check-ref-format --branch "$INPUT_RELEASE_BRANCH"
        git check-ref-format --branch "$INPUT_STABLE_BRANCH"
        if [[ ! "$INPUT_VERSION" =~ ^[A-Za-z0-9._-]+$ || "$INPUT_VERSION" == *..* ]]; then
          echo "Invalid version: use letters, digits, dots, underscores, or hyphens without '..'" >&2
          exit 1
        fi
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install -r generate-release-notes_requirements.txt
    - name: Generate release notes
      env:
        GITHUB_TOKEN: ${{ secrets.DEVOPS_GITHUB_TOKEN }}
        STOL_JIRA_URL: ${{ secrets.STOL_JIRA_URL }}
        STOL_JIRA_EMAIL: ${{ secrets.STOL_JIRA_EMAIL }}
        STOL_JIRA_TOKEN: ${{ secrets.STOL_JIRA_TOKEN }}
      shell: bash
      run: |
        set -euo pipefail
        ./generate_release_notes.py \
          --github-token "$GITHUB_TOKEN" \
          --organizations "$INPUT_ORGANIZATION" \
          --output-file "Release_Notes_$INPUT_VERSION.md" \
          --release-branch "$INPUT_RELEASE_BRANCH" \
          --stable-branch "$INPUT_STABLE_BRANCH" \
          --version "$INPUT_VERSION" \
          --jira-url "$STOL_JIRA_URL" \
          --jira-email "$STOL_JIRA_EMAIL" \
          --jira-token "$STOL_JIRA_TOKEN"
    - name: Archive release notes
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: error
        name: Release_Notes_${{ inputs.version }}.md
        path: Release_Notes_${{ inputs.version }}.md
